          schema:
            type: string
        - name: toothType
          in: path
          required: true
          description: Deciduous tooth is 1; permanent tooth is 2.
          schema:
            type: integer
            enum: [1, 2]
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
