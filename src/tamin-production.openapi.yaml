openapi: 3.1.0
info:
  title: Tamin Electronic Prescription API - Production
  version: 1.9.7
  description: >-
    Production OpenAPI contract transcribed solely from EP-TAMIN-API.md,
    document version 1.9.7 dated 1405/04/20. Where the source does not define
    a response payload, the response remains deliberately unconstrained and is
    identified as such in the companion audit.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://soa.tamin.ir
    description: Production electronic-prescription services
security:
  - taminOAuth: []
tags:
  - name: Authentication
    description: PKCE authorization, token exchange, refresh, and sign-out.
  - name: Prescriptions
    description: Prescription creation, entitlement, retrieval, deletion, and editing.
  - name: Reference Data
    description: Reference values used by prescription request fields.
  - name: Dentistry
    description: Dentistry rule checking and dentistry service lookup.
  - name: Referrals
    description: Doctor referral, referral feedback, and secretary referral workflows.
  - name: Nursing
    description: Clinic nursing cartable and nursing actions.
  - name: Referred Services
    description: Retrieval of referred medical-service prescriptions.
  - name: Hospitalization
    description: Hospitalization-order prescriptions for clinic secretaries.
  - name: Family Doctor
    description: Family-doctor patient admission share calculation.
  - name: Patient Diseases
    description: Selectable disease lookup and patient disease marking.
paths:
  /auth/server/authorize:
    get:
      tags: [Authentication]
      summary: Start the PKCE authorization flow
      operationId: beginAuthorization
      servers:
        - url: https://account.tamin.ir
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: true
          description: Registered HTTPS callback URI. Dynamic callback parameters are not supported.
          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          required: true
          description: BASE64URL-ENCODE(SHA256(ASCII(code_verifier))).
          schema:
            type: string
        - name: client_id
          in: query
          required: true
          description: Client identifier issued to the integrating company.
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          required: false
          description: Opaque client state returned unchanged on the callback.
          schema:
            type: string
      responses:
        default:
          description: >-
            Browser-facing HTML/redirect result. The source does not specify an
            HTTP status or body schema. The callback carries code, expires_in,
            and, when supplied, state.
          content:
            text/html:
              schema:
                type: string
  /auth/server/token:
    post:
      tags: [Authentication]
      summary: Exchange an authorization code for an access token
      operationId: exchangeAuthorizationCode
      servers:
        - url: https://account.tamin.ir
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeTokenRequest'
      responses:
        '200':
          description: Access token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
              example:
                access_token: eyJhbGciOiJSUzI...
                expires_in: 3600
  /auth/signout:
    get:
      tags: [Authentication]
      summary: Sign out from the electronic-prescription system
      operationId: signOutUser
      servers:
        - url: https://account.tamin.ir
      security: []
      parameters:
        - name: redirect_uri
          in: query
          required: true
          description: Registered callback URI to return to after sign-out.
          schema:
            type: string
            format: uri
      responses:
        default:
          description: Redirect result; the source does not define its status or payload.
  /auth/server/v2/token:
    post:
      tags: [Authentication]
      summary: Exchange a doctor authorization code or refresh token
      operationId: exchangeOrRefreshDoctorToken
      servers:
        - url: https://account.tamin.ir
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DoctorAuthorizationCodeGrant'
                - $ref: '#/components/schemas/DoctorRefreshTokenGrant'
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: '#/components/schemas/DoctorAuthorizationCodeGrant'
                  refresh_token: '#/components/schemas/DoctorRefreshTokenGrant'
      responses:
        '200':
          description: Doctor access-token and refresh-token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorTokenResponse'
  /interface/epresc/SendEpresc/v7:
    post:
      tags: [Prescriptions]
      summary: Create an electronic prescription
      operationId: createPrescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
            examples:
              referralFeedback:
                summary: Referral-feedback prescription
                value:
                  patient: '************'
                  mobile: '***********'
                  prescType:
                    prescTypeId: 8
                  prescDate: '14050325'
                  docId: '********'
                  docMobileNo: '********'
                  docNationalCode: '******'
                  comments: doctor-comments
                  expireDate: '14050324'
                  noteDetailEprscs: []
                  referralFeedbackId: 123456789
                  noteDetailsReferralList:
                    - referralFeedbackList:
                        - questionId: 1
                          answerId:
                            drugAnswerId: 100
                          comments: doctor-comments
                        - questionId: 2
                          answerId:
                            drugAnswerId: 101
                          comments: ''
      responses:
        '200':
          $ref: '#/components/responses/PrescriptionMutationSuccess'
        default:
          $ref: '#/components/responses/PrescriptionMutationFailure'
  /interface/epresc/patient/v2/deserve-info/{siam-id}/{doc-id}/{patient-id}:
    get:
      tags: [Prescriptions]
      summary: Check patient entitlement status
      operationId: getPatientEntitlement
      parameters:
        - $ref: '#/components/parameters/SiamIdHyphen'
        - $ref: '#/components/parameters/DocIdHyphen'
        - $ref: '#/components/parameters/PatientIdHyphen'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/{headerID}/{docId}:
    get:
      tags: [Prescriptions]
      summary: Get prescription details
      operationId: getPrescriptionDetails
      parameters:
        - $ref: '#/components/parameters/HeaderID'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/remove/{headerID}/{docId}:
    post:
      tags: [Prescriptions]
      summary: Delete a prescription on its creation day
      operationId: deletePrescription
      parameters:
        - $ref: '#/components/parameters/HeaderID'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/edit/{headerID}/{docId}:
    post:
      tags: [Prescriptions]
      summary: Replace the editable item list of a prescription
      description: >-
        The submitted list is treated as the complete item set: omitted existing
        items are removed, new items are added, and changed items are updated.
        The source states that a prescription can be edited once and that visit
        and medical-service prescriptions are not editable.
      operationId: updatePrescription
      parameters:
        - $ref: '#/components/parameters/HeaderID'
        - $ref: '#/components/parameters/DocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NoteDetailEprsc'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/prescription-type:
    get:
      tags: [Reference Data]
      summary: List electronic prescription types
      operationId: listPrescriptionTypes
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/service-type:
    get:
      tags: [Reference Data]
      summary: List prescription item types
      operationId: listPrescriptionServiceTypes
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/services:
    get:
      tags: [Reference Data]
      summary: List drug, paraclinical, and medical-service codes
      operationId: listServices
      parameters:
        - name: service-type
          in: query
          required: true
          description: Service type used to filter the coding list.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/par-taref:
    get:
      tags: [Reference Data]
      summary: List laboratory prescription subgroups
      operationId: listLaboratoryTariffGroups
      responses:
