openapi: 3.1.0
info:
  title: Tamin Electronic Prescription API - Production
  version: 1.10.1
  description: Production OpenAPI contract transcribed solely from the Tamin electronic-prescription service guide (PDF), document version 1.10.1 dated 1405/08/03; it supersedes the earlier Markdown transcription, which has been removed from the repository. Where the source does not define a response payload, the response remains deliberately unconstrained (an UndocumentedJsonSuccess response with a free-form JSON object).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.tamin.ir
security:
  - taminOAuth: []
tags:
  - name: Authentication
    description: PKCE authorization, token exchange, refresh, and sign-out.
  - name: Prescriptions
    description: Prescription creation, entitlement, retrieval, deletion, and editing.
  - name: Reference Data
    description: Reference values used by prescription request fields.
  - name: Dentistry
    description: Dentistry rule checking and dentistry service lookup.
  - name: Referrals
    description: Doctor referral, referral feedback, and secretary referral workflows.
  - name: Nursing
    description: Clinic nursing cartable and nursing actions.
  - name: Referred Services
    description: Retrieval of referred medical-service prescriptions.
  - name: Hospitalization
    description: Hospitalization-order prescriptions for clinic secretaries.
  - name: Family Doctor
    description: Family-doctor patient admission share calculation.
  - name: Patient Diseases
    description: Selectable disease lookup and patient disease marking.
paths:
  /ep/referral-feedback-questions/v1:
    get:
      tags:
        - Referrals
      summary: List referral-feedback questions
      operationId: listReferralFeedbackQuestions
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /ep/referral-feedback-responses/v1:
    get:
      tags:
        - Referrals
      summary: List referral-feedback answers
      operationId: listReferralFeedbackAnswers
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /ep/nurse-cartable/v1/{siamId}/{patientNationalCode}:
    get:
      tags:
        - Nursing
      summary: List unclaimed nursing prescriptions for a clinic
      operationId: listUnclaimedNursingPrescriptions
      parameters:
        - $ref: '#/components/parameters/SiamId'
        - $ref: '#/components/parameters/PatientNationalCode'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /ep/nursing-prescription-action/v1:
    post:
      tags:
        - Nursing
      summary: Record nursing actions on prescription items
      operationId: saveNursingActions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NursingActionRequest'
            example:
              noteDetailsEprscIds:
                - 1290361
              nurseNationalCode: '********'
              siamId: 614E4BCC-8AEE-********-********
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /ep/patient-admission/v1/{siamid}/{nationalCode}/{docId}:
    get:
      tags:
        - Family Doctor
      summary: Calculate the patient's family-doctor visit share
      operationId: calculateFamilyDoctorPatientShare
      parameters:
        - name: siamid
          in: path
          required: true
          description: SIAM identifier of the clinic or medical center.
          schema:
            type: string
        - name: nationalCode
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          description: Successful family-doctor patient-share response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyDoctorShareResponse'
              examples:
                familyDoctorPopulation:
                  value:
                    status: 200
                    family: SUCCESSFUL
                    reason: OK
                    traceId: 63854023-1eb1-4f68-a2c6-9d00d9a83c65
                    data:
                      price: 386,865
                      familyDoctor: true
                outsideFamilyDoctor:
                  value:
                    status: 200
                    family: SUCCESSFUL
                    reason: OK
                    traceId: 63854023-1eb1-4f68-a2c6-9d00d9a83c65
                    data:
                      price: مراجعه خارج از پزشک خانواده
                      familyDoctor: false
  /ep/patient-diseases-list/v1/{siamId}/{nationalCode}:
    get:
      tags:
        - Patient Diseases
      summary: List diseases that the doctor may mark for a patient
      operationId: listPatientDiseases
      parameters:
        - $ref: '#/components/parameters/SiamId'
        - name: nationalCode
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
      responses:
        '200':
          description: Successful selectable-diseases response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDiseaseListResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                traceId: 2bccffbca-f1ee-4e7e-9da0-470ffd7dd6c6
                data:
                  total: 4
                  list:
                    - id: 86
                      illText: رئینوپاتی دیابتی
                      status: '1'
                      statusDate: null
                      type: '1'
                      priorityOrder: null
                      codeMapping: H36.0
                      illName: H36.0
                    - id: 89
                      illText: پرفشاری خون کنترل شده
                      status: '1'
                      statusDate: null
                      type: '1'
                      priorityOrder: null
                      codeMapping: UnderControlHypertension_I10
                      illName: UnderControlHypertension_I10
                    - id: 87
                      illText: دیابت نوع دو
                      status: '1'
                      statusDate: null
                      type: '1'
                      priorityOrder: null
                      codeMapping: noninsulin_E11
                      illName: noninsulin_E11
                    - id: 88
                      illText: پرفشاری خون
                      status: '1'
                      statusDate: null
                      type: '1'
                      priorityOrder: null
                      codeMapping: I10
                      illName: I10
  /ep/save-patient-info-illness/v1:
    post:
      tags:
        - Patient Diseases
      summary: Mark a patient with a disease
      operationId: markPatientDisease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientIllnessRequest'
      responses:
        '200':
          $ref: '#/components/responses/PrescriptionMutationSuccess'
        default:
          $ref: '#/components/responses/PrescriptionMutationFailure'
  /ep/dosage-forms/v1:
    get:
      tags:
        - Reference Data
      summary: List drug dosage forms
      description: Lists all drug dosage forms (p35). The source documents no response payload.
      operationId: listDosageForms
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /ep/medication-instructions-by-dosage-form/v1/{formCode}:
    get:
      tags:
        - Reference Data
      summary: List SNOMED medication instructions for a dosage form
      description: Returns the values selectable for method of use, usage route, administration time and consumption amount for one drug dosage form. Doctors may call it (p35).
      operationId: getMedicationInstructionsByDosageForm
      parameters:
        - name: formCode
          in: path
          required: true
          description: Drug dosage-form code, as given by formCode for each drug in the services-coding operation and by the dosage-forms list. The sample uses 17.
          schema:
            type: string
      responses:
        '200':
          description: Successful medication-instructions response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicationInstructionsResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                traceId: b4dd4cc9-5b26-4334-82d5-d155f2b49b2c
                data:
                  methodUsages:
                    - id: '307166007'
                      name: قبل از ورزش
                      code: '307166007'
                      nameLatin: Before exercise (qualifier value)
                  drugUsages:
                    - id: '231271000'
                      name: داخل مفصلی
                      code: '231271000'
                      nameLatin: Injection into joint (procedure)
                  drugInstructions:
                    - id: '2546009'
                      name: شب
                      code: '2546009'
                      nameLatin: Night time (qualifier value)
                  formAmounts:
                    - id: '24'
                      name: عدد
                      code: '111'
                      nameLatin: Each
                      drugAmounts:
                        - id: '580'
                          name: یک چهارم عدد
                          code: '580'
                          nameLatin: 1/4 (یک چهارم) Each
  /ep/patient-nursing-services/v1/{siamId}/{doctorNationalCode}/{patientNationalCode}:
    get:
      tags:
        - Nursing
      summary: List a doctor's unclaimed nursing prescriptions for a patient in a clinic
      description: Like the clinic nursing cartable operation, but restricted to the selected doctor (p52).
      operationId: listDoctorNursingPrescriptions
      parameters:
        - $ref: '#/components/parameters/SiamId'
        - name: doctorNationalCode
          in: path
          required: true
          description: Doctor national code.
          schema:
            type: string
        - $ref: '#/components/parameters/PatientNationalCode'
      responses:
        '200':
          description: Successful doctor nursing-prescription response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NursingPrescriptionListResponse'
  /ep/inpatient-prescriptions/v1/{siamId}/{secretaryNationalCode}/{patientNationalCode}:
    get:
      tags:
        - Hospitalization
      summary: List a patient's hospitalization-order prescriptions in a clinic
      description: Same output as the clinic hospitalization-order list, restricted to one patient. Only clinic secretary users may call it (p58).
      operationId: listPatientHospitalizationOrders
      parameters:
        - $ref: '#/components/parameters/SiamId'
        - name: secretaryNationalCode
          in: path
          required: true
          description: Clinic secretary national code.
          schema:
            type: string
        - $ref: '#/components/parameters/PatientNationalCode'
      responses:
        '200':
          description: Successful patient hospitalization-order list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalizationOrderResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                traceId: 1392563c-f998-4ab3-ae25-800554c9b1e3
                data:
                  - id: 4000026
                    masterParent: 4000025
                    masterChild: null
                    referralDate: 170000721000
                    docId: '00000000008'
                    quantity: 1
                    specCodeReferral: '00446'
                    specDescReferral: فلوشیپ بهوشی کودکان
                    specCodeReferred: '00446'
                    specDescReferred: فلوشیپ بهوشی کودکان
                    icd10Referrals: null
                    complaints: null
                    message: ff
                    diagnosisIDs: X46.43
                    docFamily: true
                    patientNationalCode: '**********'
  /ep/doctor-active-hospitals/v1:
    get:
      tags:
        - Hospitalization
      summary: List hospital centers in which the doctor is active
      description: Lists all provincial hospital centers in which the doctor is active; it takes no input (p58).
      operationId: listDoctorActiveHospitals
      responses:
        '200':
          description: Successful active-center list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorActiveCenterListResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                traceId: 37f75065-e696-42e1-9903-b44785d12899
                data:
                  - dbLinkId: '1377'
                    hosName: تخصصی دیابت
                    siamId: 614E4BCC-***E-40A5-B80F-043*******EF
                    provinceName: تهران
  /ep/doctor-active-clinics/v1:
    get:
      tags:
        - Hospitalization
      summary: List clinics in which the doctor is active
      description: Lists the centers in which the doctor is a member of the electronic-prescription system; it takes no input (p63).
      operationId: listDoctorActiveClinics
      responses:
        '200':
          description: Successful active-center list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorActiveCenterListResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                traceId: 37f75065-e696-42e1-9903-b44785d12899
                data:
                  - dbLinkId: '1377'
                    hosName: تخصصی دیابت
                    siamId: 614E4BCC-***E-40A5-B80F-043*******EF
                    provinceName: تهران
components:
  securitySchemes:
    taminOAuth:
      type: oauth2
      description: PKCE authorization-code authentication documented by Tamin. The source states that the resulting token is used for the remaining services; its only documented use is as a Bearer token in the Authorization header (p30 curl sample). No scopes are documented.
      flows:
        authorizationCode:
          authorizationUrl: https://account.tamin.ir/auth/server/authorize
          tokenUrl: https://account.tamin.ir/auth/server/token
          refreshUrl: https://account.tamin.ir/auth/server/v2/token
          scopes: {}
  parameters:
    DocId:
      name: docId
      in: path
      required: true
      description: Medical Council number.
      schema:
        type: string
    PatientNationalCode:
      name: patientNationalCode
      in: path
      required: true
      description: Patient national code.
      schema:
        type: string
    SiamId:
      name: siamId
      in: path
      required: true
      description: SIAM identifier of the clinic or medical center.
      schema:
        type: string
  responses:
    UndocumentedJsonSuccess:
      description: Successful JSON response. The source document does not define the wire schema for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    PrescriptionMutationSuccess:
      description: Successful mutation response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrescriptionMutationResponse'
    PrescriptionMutationFailure:
      description: Error response. The source documents error_Code and error_Msg but does not define the corresponding HTTP status codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrescriptionMutationResponse'
          examples:
            nullData:
              value:
                error_Msg: data is null خطا در اطلاعات ورودی
            missingMobile:
              value:
                error_Msg: شماره تلفن همراه وارد نشده است
            invalidMobile:
              value:
                error_Msg: شماره تلفن همراه به درستی وارد نشده است
            invalidPatientNationalCode:
              value:
                error_Msg: کد ملی بیمار معتبر نمی باشد
            invalidDoctorIdentity:
              value:
                error_Msg: کدملی/ تلفن همراه پزشک معتبر نمی باشد
            undefinedServiceCode:
              value:
                error_Msg: کد خدمت + srvcode + تعریف نشده است
            missingPrescriptionType:
              value:
                error_Msg: نوع نسخه انتخاب نشده است
            invalidPrescriptionType:
              value:
                error_Msg: نوع نسخه بدرستی وارد نشده است
            duplicatePrescription:
              value:
                error_Msg: نوع نسخه تکراری است
            invalidPrescriptionDate:
              value:
                error_Msg: تاریخ به درستی وارد نشده است
            futurePrescriptionDate:
              value:
                error_Msg: تاریخ نسخه نمی تواند از تاریخ روز بزرگتر باشد.
            invalidDrugAmount:
              value:
                error_Msg: مقادیر مصرف صحیح وارد نشده است
            invalidDrugInstruction:
              value:
                error_Msg: زمان مصرف صحیح وارد نشده است
  schemas:
    JsonObject:
      type: object
      description: Unconstrained JSON object because the source does not document its fields.
      additionalProperties: true
    TbDrugAmount:
      type: object
      additionalProperties: true
      required:
        - drugAmntId
      properties:
        drugAmntId:
          type: integer
          description: Value supplied by the drug-amount reference operation.
    DrugInstruction:
      type: object
      additionalProperties: true
      required:
        - drugInstId
      properties:
        drugInstId:
          type: integer
          description: Value supplied by the drug-instruction reference operation.
    DiagnosisID:
      type: object
      description: Initial diagnosis; currently documented for drug prescriptions only (p16).
      additionalProperties: true
      required:
        - icdId
      properties:
        icdId:
          type: integer
          description: Initial diagnosis identifier, currently documented for drug prescriptions.
    PrescriptionMutationResponse:
      type: object
      additionalProperties: true
      properties:
        head_EPRSC_ID:
          type:
            - integer
            - 'null'
          format: int64
          description: Prescription identifier.
        complemantary_Msg:
          type:
            - string
            - 'null'
          description: Populated on success. The wire name is spelled complemantary_Msg in the source (p62).
        error_Code:
          type:
            - string
            - 'null'
          description: Populated on failure.
        error_Msg:
          type:
            - string
            - 'null'
          description: Populated on failure.
        trackingCode:
          type:
            - integer
            - 'null'
          description: Prescription tracking code.
    NursingActionRequest:
      type: object
      additionalProperties: true
      required:
        - siamId
        - noteDetailsEprscIds
        - nurseNationalCode
      properties:
        siamId:
          type: string
          description: Clinic identifier.
        noteDetailsEprscIds:
          type: array
          items:
            type: integer
            format: int64
        nurseNationalCode:
          type: string
    PatientIllnessRequest:
      type: object
      additionalProperties: true
      required:
        - patientNationalCode
        - illId
        - mobileNumber
        - siamId
        - inputType
      properties:
        patientNationalCode:
          type: string
        illId:
          type: integer
          description: Disease id returned by listPatientDiseases.
        mobileNumber:
          type: string
        siamId:
          type: string
          description: SIAM identifier; when the doctor acts from an office, the doctor's national code is sent instead.
        inputType:
          type: integer
          enum:
            - 1
        type:
          type: string
          enum:
            - '1'
            - '2'
            - '3'
          description: 'Required only for autism: 1 support required; 2 substantial support required; 3 very substantial support required.'
    ServiceDetails:
      type: object
      additionalProperties: true
      required:
        - srvId
        - srvType
        - srvCode
        - srvName
      properties:
        srvId:
          type: integer
          format: int64
        srvType:
          $ref: '#/components/schemas/ServiceTypeDetails'
        srvCode:
          type: string
        srvName:
          type: string
        srvName2:
          type:
            - string
            - 'null'
        srvBimSw:
          type:
            - string
            - 'null'
        srvSex:
          type:
            - string
            - 'null'
        srvPrice:
          type:
            - integer
            - 'null'
          format: int64
        srvPriceDate:
          type:
            - string
            - 'null'
        doseCode:
          type:
            - string
            - 'null'
        formCode:
          anyOf:
            - $ref: '#/components/schemas/DrugForm'
            - type: 'null'
        parTarefGrp:
          anyOf:
            - $ref: '#/components/schemas/ParTarefGroupDetails'
            - type: 'null'
        status:
          type:
            - string
            - 'null'
        statusstDate:
          type:
            - string
            - 'null'
        bGType:
          type:
            - string
            - 'null'
        gSrvCode:
          type:
            - string
            - 'null'
        agreementFlag:
          type:
            - string
            - 'null'
        isDeleted:
          type:
            - string
            - 'null'
        visible:
          type:
            - string
            - 'null'
        dentalServiceType:
          type:
            - string
            - 'null'
        wsSrvCode:
          type:
            - string
            - 'null'
        hosprescType:
          type:
            - string
            - 'null'
        srvRule:
          type:
            - string
            - 'null'
        countIsRestricted:
          type:
            - string
            - 'null'
        drugWarning:
          type:
            - string
            - 'null'
        terminology:
          type:
            - string
            - 'null'
        srvCodeComplete:
          type:
            - string
            - 'null'
    ServiceTypeDetails:
      type: object
      additionalProperties: true
      required:
        - srvType
      properties:
        srvType:
          type: string
        srvTypeDes:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
        statusstDate:
          type:
            - string
            - 'null'
        custType:
          type:
            - string
            - 'null'
        prescTypeId:
          type:
            - integer
            - 'null'
        headExpireDate:
          type:
            - integer
            - 'null'
    DrugForm:
      type: object
      additionalProperties: true
      required:
        - formCode
      properties:
        formCode:
          type: string
        formDes:
          type:
            - string
            - 'null'
        formGrp:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
        statusstDate:
          type:
            - string
            - 'null'
    ParTarefGroupDetails:
      type: object
      additionalProperties: true
      description: Paraclinical group of a response service (p46, p48); null for services without a group. The request-side ParTarefGroup carries only parGrpCode; the response sample adds parGrpDesc (empty in the sample), parGrpRem, status and statusStDate. Only parGrpCode is required.
      required:
        - parGrpCode
      properties:
        parGrpCode:
          type: string
          description: Group code, for example 002 (genetics). Same codes as the request-side ParTarefGroup.
        parGrpDesc:
          type:
            - string
            - 'null'
        parGrpRem:
          type:
            - string
            - 'null'
        status:
          type:
            - string
            - 'null'
        statusStDate:
          type:
            - string
            - 'null'
    HospitalizationOrderResponse:
      type: object
      additionalProperties: true
      required:
        - status
        - family
        - reason
        - traceId
        - data
      properties:
        status:
          type: integer
        family:
          type: string
        reason:
          type: string
        traceId:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/HospitalizationOrder'
    HospitalizationOrder:
      type: object
      additionalProperties: true
      required:
        - id
        - masterParent
        - referralDate
        - docId
        - quantity
        - specCodeReferral
        - specDescReferral
        - specCodeReferred
        - specDescReferred
        - docFamily
      properties:
        id:
          type: integer
          format: int64
        masterParent:
          type: integer
          format: int64
        masterChild:
          type:
            - integer
            - 'null'
          format: int64
        referralDate:
          type: integer
          format: int64
          description: Epoch timestamp (documented as Epoch TimeStamp for the same field on p50). The p57 sample value has 12 digits, one fewer than the 13-digit millisecond values on p44 and p47.
        docId:
          type: string
        quantity:
          type: integer
        specCodeReferral:
          type: string
        specDescReferral:
          type: string
        specCodeReferred:
          type: string
        specDescReferred:
          type: string
        icd10Referrals:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ReferralIcd10Response'
        complaints:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ReferralComplaintResponse'
        message:
          type:
            - string
            - 'null'
        diagnosisIDs:
          type:
            - string
            - 'null'
        docFamily:
          type: boolean
          description: True when the hospitalization order was registered through family-doctor flow.
        patientNationalCode:
          type: string
          description: Patient national code (added in document version 1.9.8, p57).
    FamilyDoctorShareResponse:
      type: object
      additionalProperties: true
      required:
        - status
        - family
        - reason
        - traceId
        - data
      properties:
        status:
          type: integer
        family:
          type: string
        reason:
          type: string
        traceId:
          type: string
        data:
          type: object
          additionalProperties: true
          required:
            - price
            - familyDoctor
          properties:
            price:
              type: string
              description: Formatted amount or the documented out-of-family-doctor message.
            familyDoctor:
              type: boolean
    PatientDiseaseListResponse:
      type: object
      additionalProperties: true
      required:
        - status
        - family
        - reason
        - traceId
        - data
      properties:
        status:
          type: integer
        family:
          type: string
        reason:
          type: string
        traceId:
          type: string
        data:
          type: object
          additionalProperties: true
          required:
            - total
            - list
          properties:
            total:
              type: integer
            list:
              type: array
              items:
                $ref: '#/components/schemas/PatientDisease'
    PatientDisease:
      type: object
      additionalProperties: true
      required:
        - id
        - illText
        - status
        - type
        - codeMapping
        - illName
      properties:
        id:
          type: integer
        illText:
          type: string
        status:
          type: string
        statusDate:
          type:
            - string
            - 'null'
        type:
          type: string
        priorityOrder:
          type:
            - integer
            - 'null'
        codeMapping:
          type: string
        illName:
          type: string
    ReferralComplaintResponse:
      type: object
      additionalProperties: true
      description: Complaint as returned in referral responses (p47). Requests use ReferralComplaint, where id is a string.
      required:
        - id
      properties:
        id:
          type: integer
        code:
          type: integer
          format: int64
          description: Complaint coding value.
        displayName:
          type: string
        englishName:
          type: string
        terminology:
          type: string
          description: Coding system name as printed in the sample (SNOMEDCT).
        status:
          type: string
    ReferralIcd10Response:
      type: object
      additionalProperties: true
      description: Initial diagnosis as returned in referral responses (p47). Requests use ReferralIcd10, which carries only the ICD-10 code in icdId.
      required:
        - icdId
      properties:
        icdId:
          type: string
          description: Internal diagnosis identifier, printed as a string in the sample.
        icdCode:
          type: string
          description: ICD-10 code.
        icdName:
          type: string
    MedicationInstructionsResponse:
      type: object
      additionalProperties: true
      description: SNOMED medication-instruction values valid for one drug dosage form (p35-36).
      required:
        - status
        - family
        - reason
        - traceId
        - data
      properties:
        status:
          type: integer
        family:
          type: string
        reason:
          type: string
        traceId:
          type: string
        data:
          type: object
          additionalProperties: true
          required:
            - methodUsages
            - drugUsages
            - drugInstructions
            - formAmounts
          properties:
            methodUsages:
              type: array
              items:
                $ref: '#/components/schemas/MedicationInstructionOption'
              description: Methods of use (p36); the chosen id is sent as methodUsage.id.
            drugUsages:
              type: array
              items:
                $ref: '#/components/schemas/MedicationInstructionOption'
              description: Usage routes (p36); the chosen id is sent as doseCode (p31).
            drugInstructions:
              type: array
              items:
                $ref: '#/components/schemas/MedicationInstructionOption'
              description: Administration times (p36); the chosen id is sent as drugInstruction.drugInstId.
            formAmounts:
              type: array
              items:
                $ref: '#/components/schemas/FormAmount'
              description: Consumption units, each with its selectable amounts (p36).
    MedicationInstructionOption:
      type: object
      additionalProperties: true
      description: Selectable value in the medication-instructions response (p35-36). The ids are printed as strings in the sample.
      required:
        - id
        - name
        - code
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        nameLatin:
          type: string
    FormAmount:
      type: object
      additionalProperties: true
      description: Consumption unit with the amounts selectable for it (p36).
      required:
        - id
        - name
        - code
        - drugAmounts
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        nameLatin:
          type: string
        drugAmounts:
          type: array
          items:
            $ref: '#/components/schemas/MedicationInstructionOption'
          description: Consumption amounts for this unit; the id of the chosen entry is sent as timesAday.drugAmntId (p36).
    NursingPrescriptionListResponse:
      type: object
      additionalProperties: true
      description: Nursing prescriptions of one doctor and patient in a clinic (p53). The sample has no status, family or reason envelope.
      required:
        - total
        - list
      properties:
        total:
          type: integer
        list:
          type: array
          items:
            $ref: '#/components/schemas/NursingPrescription'
    NursingPrescription:
      type: object
      additionalProperties: true
      description: Nursing-service prescription returned for a clinic (p53).
      required:
        - noteHeadId
        - trackingCode
        - noteDetailEprscs
      properties:
        noteHeadId:
          type: integer
          format: int64
        prescCreationTime:
          type: integer
          format: int64
          description: Epoch-style timestamp of prescription creation; the sample value has 13 digits.
        docId:
          type: string
          description: Medical Council number.
        patientFirstName:
          type: string
        patientLastName:
          type: string
        docEprscId:
          type: integer
          format: int64
        clinicDocId:
          type: integer
          format: int64
        trackingCode:
          type: integer
        nationalCode:
          type: string
          description: National code as printed in the sample; the source does not say whether it belongs to the patient or the doctor.
        isOk:
          type: string
        docFirstName:
          type: string
        docLastName:
          type: string
        prescType:
          type: integer
          description: Prescription type id (5 in the sample). Unlike other responses, this payload carries a bare integer rather than a prescType object.
        isSpecialPatient:
          type: integer
        noteDetailEprscs:
          type: array
          items:
            $ref: '#/components/schemas/NursingPrescriptionItem'
    NursingPrescriptionItem:
      type: object
      additionalProperties: true
      description: 'Prescription item inside a nursing-cartable prescription (p53-56). Every optional member in the sample is null, so a type can only be taken from the same-named request field that the guide documents (p16-20). Members with such a type are declared nullable. Members without one are not declared and pass through additionalProperties: isBrand, isPayable, organId, organDesc, organDet, organDetDesc, illnessDesc, planDesc, confirmStatusflag, noteHeadEprscId, repeatDays, messages, dialysisType. repeat, dateDo and isDentalService are also not declared because their wire types are still undecided pending pilot testing.'
      required:
        - noteDetailsEprscId
        - srvId
        - srvQty
      properties:
        noteDetailsEprscId:
          type: integer
          format: int64
          description: Item identifier; this is the value sent in noteDetailsEprscIds when recording a nursing action.
        srvId:
          $ref: '#/components/schemas/ServiceDetails'
        srvQty:
          type: integer
        srvRem:
          type: integer
        srvPrice:
          type: integer
          format: int64
        noteDetailDrug:
          anyOf:
            - $ref: '#/components/schemas/DiagnosisID'
            - type: 'null'
        timesAday:
          anyOf:
            - $ref: '#/components/schemas/TbDrugAmount'
            - type: 'null'
        dose:
          type:
            - string
            - 'null'
          description: Usage route (p16).
        doseCode:
          type:
            - string
            - 'null'
          description: Usage-route code (p16).
        drugInstruction:
          anyOf:
            - $ref: '#/components/schemas/DrugInstruction'
            - type: 'null'
        illnessId:
          type:
            - string
            - 'null'
          description: Physiotherapy illness id or comma-separated ids (p27).
        planId:
          type:
            - string
            - 'null'
          description: Physiotherapy plan id or comma-separated ids.
        drugAmntId:
          type:
            - integer
            - 'null'
        drugInstId:
          type:
            - integer
            - 'null'
        toothId:
          type:
            - string
            - 'null'
          description: FDI tooth code when the service is tied to a tooth.
        referenceStatus:
          type:
            - integer
            - 'null'
          description: Referred-service action status.
        isOk:
          type: string
        readOnly:
          type: boolean
    DoctorActiveCenterListResponse:
      type: object
      additionalProperties: true
      description: Centers in which the doctor is active (p58, p63). Hospitals and clinics share this shape.
      required:
        - status
        - family
        - reason
        - traceId
        - data
      properties:
        status:
          type: integer
        family:
          type: string
        reason:
          type: string
        traceId:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/DoctorActiveCenter'
    DoctorActiveCenter:
      type: object
      additionalProperties: true
      description: Clinic or hospital in which the doctor is active (p63).
      required:
        - dbLinkId
        - hosName
        - siamId
        - provinceName
      properties:
        dbLinkId:
          type: string
          description: Province identifier.
        hosName:
          type: string
          description: Center name.
        siamId:
          type: string
          description: SIAM identifier of the center.
        provinceName:
          type: string
          description: Province name.
