openapi: 3.1.0
info:
  title: Tamin Electronic Prescription API - Production
  version: 1.10.1
  description: Production OpenAPI contract transcribed solely from the Tamin electronic-prescription service guide (PDF), document version 1.10.1 dated 1405/08/03; it supersedes the earlier Markdown transcription, which has been removed from the repository. Where the source does not define a response payload, the response remains deliberately unconstrained (an UndocumentedJsonSuccess response with a free-form JSON object).
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://soa.tamin.ir
security:
  - taminOAuth: []
tags:
  - name: Authentication
    description: PKCE authorization, token exchange, refresh, and sign-out.
  - name: Prescriptions
    description: Prescription creation, entitlement, retrieval, deletion, and editing.
  - name: Reference Data
    description: Reference values used by prescription request fields.
  - name: Dentistry
    description: Dentistry rule checking and dentistry service lookup.
  - name: Referrals
    description: Doctor referral, referral feedback, and secretary referral workflows.
  - name: Nursing
    description: Clinic nursing cartable and nursing actions.
  - name: Referred Services
    description: Retrieval of referred medical-service prescriptions.
  - name: Hospitalization
    description: Hospitalization-order prescriptions for clinic secretaries.
  - name: Family Doctor
    description: Family-doctor patient admission share calculation.
  - name: Patient Diseases
    description: Selectable disease lookup and patient disease marking.
paths:
  /interface/epresc/SendEpresc/v2:
    post:
      tags:
        - Prescriptions
      summary: Create an electronic prescription
      operationId: createPrescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionCreateRequest'
            examples:
              referralFeedback:
                summary: Referral-feedback prescription
                value:
                  patient: '************'
                  prescType:
                    prescTypeId: 8
                  prescDate: '14050325'
                  docId: '********'
                  docMobileNo: '********'
                  docNationalCode: '******'
                  comments: doctor-comments
                  expireDate: '14050324'
                  noteDetailEprscs: []
                  referralFeedbackId: 123456789
                  noteDetailsReferralList:
                    - referralFeedbackList:
                        - questionId: 1
                          answerId:
                            drugAnswerId: 100
                          comments: doctor-comments
                        - questionId: 2
                          answerId:
                            drugAnswerId: 101
                          comments: ''
      responses:
        '200':
          $ref: '#/components/responses/PrescriptionMutationSuccess'
        default:
          $ref: '#/components/responses/PrescriptionMutationFailure'
  /interface/epresc/patient/v2/deserve-info/{siam-id}/{doc-id}/{patient-id}:
    get:
      tags:
        - Prescriptions
      summary: Check patient entitlement status
      operationId: getPatientEntitlement
      parameters:
        - $ref: '#/components/parameters/SiamIdHyphen'
        - $ref: '#/components/parameters/DocIdHyphen'
        - $ref: '#/components/parameters/PatientIdHyphen'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/{headerID}/{docId}:
    get:
      tags:
        - Prescriptions
      summary: Get prescription details
      operationId: getPrescriptionDetails
      parameters:
        - $ref: '#/components/parameters/HeaderID'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/remove/{headerID}/{docId}:
    post:
      tags:
        - Prescriptions
      summary: Delete a prescription on its creation day
      operationId: deletePrescription
      parameters:
        - $ref: '#/components/parameters/HeaderID'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/edit/{headerID}/{docId}:
    post:
      tags:
        - Prescriptions
      summary: Replace the editable item list of a prescription
      description: 'The submitted list is treated as the complete item set: omitted existing items are removed, new items are added, and changed items are updated. The source states that a prescription can be edited once and that visit and medical-service prescriptions are not editable.'
      operationId: updatePrescription
      parameters:
        - $ref: '#/components/parameters/HeaderID'
        - $ref: '#/components/parameters/DocId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NoteDetailEprsc'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/prescription-type:
    get:
      tags:
        - Reference Data
      summary: List electronic prescription types
      operationId: listPrescriptionTypes
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/service-type:
    get:
      tags:
        - Reference Data
      summary: List prescription item types
      operationId: listPrescriptionServiceTypes
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/services:
    get:
      tags:
        - Reference Data
      summary: List drug, paraclinical, and medical-service codes
      operationId: listServices
      parameters:
        - name: service-type
          in: query
          required: true
          description: Service type used to filter the coding list.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/par-taref:
    get:
      tags:
        - Reference Data
      summary: List laboratory prescription subgroups
      operationId: listLaboratoryTariffGroups
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/drug-amount:
    get:
      tags:
        - Reference Data
      summary: List drug consumption amounts
      operationId: listDrugAmounts
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/drug-usage:
    get:
      tags:
        - Reference Data
      summary: List drug usage methods
      operationId: listDrugUsages
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/drug-instruction:
    get:
      tags:
        - Reference Data
      summary: List drug administration times
      operationId: listDrugInstructions
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/ph-plan:
    get:
      tags:
        - Reference Data
      summary: List physiotherapy treatment plans
      operationId: listPhysiotherapyPlans
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/ph-illness:
    get:
      tags:
        - Reference Data
      summary: List physiotherapy illness types
      operationId: listPhysiotherapyIllnesses
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/complaint:
    get:
      tags:
        - Reference Data
      summary: List referral complaints
      operationId: listComplaints
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/icd10/getAll:
    get:
      tags:
        - Reference Data
      summary: List ICD-10 initial diagnoses
      operationId: listIcd10Diagnoses
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/special/getAll:
    get:
      tags:
        - Reference Data
      summary: List doctor specialties
      operationId: listDoctorSpecialties
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/check-rules-in-detail:
    post:
      tags:
        - Dentistry
      summary: Check dentistry rules and tariffs
      operationId: checkDentistRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DentistRuleRequest'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/find-dentist-service-name-without-tooth/{dentistType}:
    get:
      tags:
        - Dentistry
      summary: List dentistry services not tied to a selected tooth
      operationId: listDentistServicesWithoutTooth
      parameters:
        - name: dentistType
          in: path
          required: true
          description: Dentistry service category; this operation is documented for code 1.
          schema:
            type: integer
            enum:
              - 1
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/find-dentist-service-name-by-tooth/{selectedTooth}/{patientId}/{toothType}:
    get:
      tags:
        - Dentistry
      summary: List dentistry services for a selected tooth
      operationId: listDentistServicesByTooth
      parameters:
        - name: selectedTooth
          in: path
          required: true
          description: FDI code of the selected tooth.
          schema:
            type: string
        - name: patientId
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
        - name: toothType
          in: path
          required: true
          description: Deciduous tooth is 1; permanent tooth is 2.
          schema:
            type: integer
            enum:
              - 1
              - 2
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/noteDetailsReferral/count/{nationalCode}/{docId}:
    get:
      tags:
        - Referrals
      summary: Get the number of open referrals for a doctor's specialty
      operationId: getOpenReferralCount
      parameters:
        - $ref: '#/components/parameters/NationalCode'
        - $ref: '#/components/parameters/DocId'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/findNoteReferral/{nationalCode}/{docId}/{trackingCode}:
    get:
      tags:
        - Referrals
      summary: Get a doctor-referral prescription
      operationId: getReferralPrescription
      parameters:
        - name: nationalCode
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/TrackingCode'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/findNoteReferral/{masterId}/{nationalCode}:
    get:
      tags:
        - Referrals
      summary: List prescriptions having referral feedback
      operationId: listReferralFeedbackPrescriptions
      parameters:
        - name: masterId
          in: path
          required: true
          description: Value returned as masterParent by the referral-prescription operation.
          schema:
            type: integer
            format: int64
        - name: nationalCode
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/noteDetailsReferral/referredList/{nationalCode}:
    get:
      tags:
        - Referrals
      summary: List a doctor's referrals from the last three days
      operationId: listRecentDoctorReferrals
      parameters:
        - name: nationalCode
          in: path
          required: true
          description: Doctor national code.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/fetchReferralCartable/{docNationalCode}/{patientNationalCode}/{trackingCode}:
    get:
      tags:
        - Referrals
      summary: Get a patient's registered referral from the referral cartable
      operationId: getReferralCartable
      parameters:
        - $ref: '#/components/parameters/DocNationalCode'
        - $ref: '#/components/parameters/PatientNationalCode'
        - $ref: '#/components/parameters/TrackingCode'
      responses:
        '200':
          description: Successful referral-cartable response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralCartableResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                data:
                  total: 1
                  list:
                    - noteHeadId: شناسه ی یکتا نسخه
                      referralId: شناسه ارجاع ثبت شده
                      patientID: کد ملی پزشک
                      docID: شماره نظام پزشک
                      prescDate: تاریخ نسخه
                      firstName: نام بیمار
                      lastName: نام خانوادگی بیمار
                      prescType:
                        prescTypeId: 7
                        prescTypeCode: '07'
                        prescTypeDesc: نسخه ارجاع
                      masterChild: 327247893
                      referralDate: تاریخ ارجاع
                      specCodeReferral: کد تخصص پزشک ارجاع دهنده
                      specDescReferral: عنوان تخصص پزشک ارجاع دهنده
                      specCodeReferred: کد تخصص پزشک ارجاع شده
                      specDescReferred: عنوان تخصص پزشک ارجاع شده
  /interface/epresc/SendEpresc/v2/referral/noteDetail/{id}/{masterParent}:
    get:
      tags:
        - Referrals
      summary: Get details of a prescription registered as referral feedback
      operationId: getReferralFeedbackDetails
      parameters:
        - name: id
          in: path
          required: true
          description: Prescription id; zero identifies the feedback prescription itself.
          schema:
            type: integer
            format: int64
        - name: masterParent
          in: path
          required: true
          description: Parent referral identifier (masterParent) from the referral feedback list response (p44-45).
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful referral-feedback detail response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralFeedbackDetailResponse'
  /interface/epresc/SendEpresc/v2/patientNoteDetailsReferral/count/{nationalCode}:
    get:
      tags:
        - Referrals
      summary: List a patient's open referrals for secretary admission
      operationId: listPatientOpenReferrals
      parameters:
        - name: nationalCode
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
      responses:
        '200':
          description: Successful patient open-referrals response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOpenReferralsResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                data:
                  noteDetailsReferrals:
                    - specCode: '00199'
                      specDesc: پزشکی-بیولوژی
                      specGRP: '6'
                      docComment: null
                      status: '1'
                      statusstDate: '13900101'
                      typeSpec: null
                      maxNormal: null
                      maxSpecial: null
                      lstatus: '0'
                      referralDate: 1792075765000
                  count: 1
  /interface/epresc/SendEpresc/v2/{nationalCode}/{docId}/{trackingCode}/referentialPrescDetail:
    get:
      tags:
        - Referred Services
      summary: Get a referred-service prescription
      operationId: getReferredServicePrescription
      parameters:
        - name: nationalCode
          in: path
          required: true
          description: Patient national code.
          schema:
            type: string
        - $ref: '#/components/parameters/DocId'
        - $ref: '#/components/parameters/TrackingCode'
      responses:
        '200':
          $ref: '#/components/responses/UndocumentedJsonSuccess'
  /interface/epresc/SendEpresc/v2/hospitalization-order/fetch/{siam-id}/{secretaryNationalCode}:
    get:
      tags:
        - Hospitalization
      summary: List hospitalization-order prescriptions for a clinic
      operationId: listHospitalizationOrders
      parameters:
        - $ref: '#/components/parameters/SiamIdHyphen'
        - name: secretaryNationalCode
          in: path
          required: true
          description: Clinic secretary national code.
          schema:
            type: string
      responses:
        '200':
          description: Successful hospitalization-order list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalizationOrderResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                traceId: 1392563c-f998-4ab3-ae25-800554c9b1e3
                data:
                  - id: 4000026
                    masterParent: 4000025
                    masterChild: null
                    referralDate: 170000721000
                    docId: '00000000008'
                    quantity: 1
                    specCodeReferral: '00446'
                    specDescReferral: فلوشیپ بهوشی کودکان
                    specCodeReferred: '00446'
                    specDescReferred: فلوشیپ بهوشی کودکان
                    icd10Referrals: null
                    complaints: null
                    message: ff
                    diagnosisIDs: X46.43
                    docFamily: true
                    patientNationalCode: '**********'
  /interface/epresc/SendEpresc/v2/referralList/{referralId}:
    get:
      tags:
        - Referrals
      summary: List the feedback entries registered for a referral
      description: Returns the entries the second doctor registered for the referral identified by referralId. The id and masterParent of each entry feed the referral-feedback detail operation (p44-45).
      operationId: listReferralFeedbackEntries
      parameters:
        - name: referralId
          in: path
          required: true
          description: Registered referral identifier, returned as referralId by the referral-cartable operation. Its scalar type is undocumented.
          schema:
            type: string
      responses:
        '200':
          description: Successful referral feedback list response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralListResponse'
              example:
                status: 200
                family: SUCCESSFUL
                reason: OK
                data:
                  total: 2
                  list:
                    - id: 327241062
                      masterParent: 327240269
                      masterChild: 327247893
                      referralDate: 1750517662000
                      docId: '**********'
                      quantity: 1
                      specCodeReferral: '00100'
                      specDescReferral: پزشک عمومی
                      specCodeReferred: '00138'
                      specDescReferred: متخصص قلب و عروق
                      icd10Referrals: null
                      complaints: null
                      message: بیماری تشخیص داده شده و توضیحات
                      diagnosisIDs: W27.19
                    - id: 0
                      masterParent: 327247893
                      masterChild: null
                      referralDate: 1747839599371
                      docId: null
                      quantity: 0
                      specCodeReferral: '00138'
                      specDescReferral: متخصص قلب و عروق
                      specCodeReferred: null
                      specDescReferred: null
                      icd10Referrals: null
                      complaints: null
                      message: null
                      diagnosisIDs: null
components:
  securitySchemes:
    taminOAuth:
      type: oauth2
      description: PKCE authorization-code authentication documented by Tamin. The source states that the resulting token is used for the remaining services; its only documented use is as a Bearer token in the Authorization header (p30 curl sample). No scopes are documented.
      flows:
        authorizationCode:
          authorizationUrl: https://account.tamin.ir/auth/server/authorize
          tokenUrl: https://account.tamin.ir/auth/server/token
          refreshUrl: https://account.tamin.ir/auth/server/v2/token
          scopes: {}
  parameters:
    HeaderID:
      name: headerID
      in: path
      required: true
      description: Unique prescription number returned as head_EPRSC_ID.
      schema:
        type: integer
        format: int64
    DocId:
      name: docId
      in: path
      required: true
      description: Medical Council number.
      schema:
        type: string
    DocNationalCode:
      name: docNationalCode
      in: path
      required: true
      description: Doctor national code.
      schema:
        type: string
    PatientNationalCode:
      name: patientNationalCode
      in: path
      required: true
      description: Patient national code.
      schema:
        type: string
    NationalCode:
      name: nationalCode
      in: path
      required: true
      description: National code. The role-specific meaning is stated by each operation.
      schema:
        type: string
    TrackingCode:
      name: trackingCode
      in: path
      required: true
      description: Prescription tracking code.
      schema:
        type: integer
    SiamIdHyphen:
      name: siam-id
      in: path
      required: true
      description: SIAM identifier of the clinic. For an office-based entitlement check, the doctor's Medical Council number is sent instead.
      schema:
        type: string
    DocIdHyphen:
      name: doc-id
      in: path
      required: true
      description: Medical Council number.
      schema:
        type: string
    PatientIdHyphen:
      name: patient-id
      in: path
      required: true
      description: Patient national code.
      schema:
        type: string
  responses:
    UndocumentedJsonSuccess:
      description: Successful JSON response. The source document does not define the wire schema for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JsonObject'
    PrescriptionMutationSuccess:
      description: Successful mutation response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrescriptionMutationResponse'
    PrescriptionMutationFailure:
      description: Error response. The source documents error_Code and error_Msg but does not define the corresponding HTTP status codes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PrescriptionMutationResponse'
          examples:
            nullData:
              value:
                error_Msg: data is null خطا در اطلاعات ورودی
            missingMobile:
              value:
                error_Msg: شماره تلفن همراه وارد نشده است
            invalidMobile:
              value:
                error_Msg: شماره تلفن همراه به درستی وارد نشده است
            invalidPatientNationalCode:
              value:
                error_Msg: کد ملی بیمار معتبر نمی باشد
            invalidDoctorIdentity:
              value:
                error_Msg: کدملی/ تلفن همراه پزشک معتبر نمی باشد
            undefinedServiceCode:
              value:
                error_Msg: کد خدمت + srvcode + تعریف نشده است
            missingPrescriptionType:
              value:
                error_Msg: نوع نسخه انتخاب نشده است
            invalidPrescriptionType:
              value:
                error_Msg: نوع نسخه بدرستی وارد نشده است
            duplicatePrescription:
              value:
                error_Msg: نوع نسخه تکراری است
            invalidPrescriptionDate:
              value:
                error_Msg: تاریخ به درستی وارد نشده است
            futurePrescriptionDate:
              value:
                error_Msg: تاریخ نسخه نمی تواند از تاریخ روز بزرگتر باشد.
            invalidDrugAmount:
              value:
                error_Msg: مقادیر مصرف صحیح وارد نشده است
            invalidDrugInstruction:
              value:
                error_Msg: زمان مصرف صحیح وارد نشده است
  schemas:
    JsonObject:
      type: object
      description: Unconstrained JSON object because the source does not document its fields.
      additionalProperties: true
    JalaliDate:
      type: string
      minLength: 8
      maxLength: 8
      pattern: ^[0-9]{8}$
      description: Solar Hijri date encoded as an eight-digit string, for example 14040610.
    PrescriptionCreateRequest:
      type: object
      additionalProperties: true
      description: Electronic prescription payload. prescDate cannot be later than the current date. For prescTypeId 3, noteDetailEprscs must be empty. For prescTypeId 1, every srvType must be 01. For prescTypeId 2, srvType must be one of 02 through 08 or 11 through 14 (p64). prescTypeId 6 accepts only medical-service items. Conditional referral, hospitalization, nursing, dentistry, and physiotherapy rules are described on the corresponding properties because the source does not provide a single machine-enforceable discriminator contract.
      required:
        - patient
        - prescDate
        - docId
        - docNationalCode
        - docMobileNo
        - prescType
      properties:
        patient:
          type: string
          description: Patient national code.
        mobile:
          type: string
          description: Patient mobile number. The PDF field table (p14-15) does not list this field, but p65 documents errors for an empty or malformed mobile value and the samples on p20 and p26 send it, so it is kept as an optional property.
        prescDate:
          $ref: '#/components/schemas/JalaliDate'
        expireDate:
          $ref: '#/components/schemas/JalaliDate'
        docId:
          type: string
          description: Medical Council number without a symbol.
        docNationalCode:
          type: string
          description: Doctor national code; must match the registered doctor.
        docMobileNo:
          type: string
          description: Doctor mobile number; must match the registered doctor.
        prescType:
          $ref: '#/components/schemas/PrescType'
        comments:
          type: string
          description: Required for referral-feedback prescriptions (prescTypeId 8).
        noteDetailEprscs:
          type: array
