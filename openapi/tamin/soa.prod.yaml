            - 2
            - 3
            - 5
            - 6
            - 7
            - 8
            - 9
          description: 1 drug; 2 paraclinical (srvType 02 through 08 and 11 through 14 only, p64); 3 visit; 5 services; 6 referred services; 7 doctor referral; 8 doctor-referral feedback; 9 hospitalization order.
