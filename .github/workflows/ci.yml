name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "src/**"
      - "openapi/**"
      - "scripts/**"
      - ".config/dotnet-tools.json"
      - "Directory.Build.props"
      - "Vorn.Tamin.slnx"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore --force
          npm ci

      - name: Verify generated contracts
        shell: pwsh
        run: ./scripts/verify-tamin-contracts.ps1

      - name: Build
        run: dotnet build -m --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
